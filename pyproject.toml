[project]
name = "seatapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sameehan", email = "sameehandeshpande@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
seatapi = "seatapi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
